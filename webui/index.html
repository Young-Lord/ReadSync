<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadSync</title>
<link rel="stylesheet" href="style.css">
<script>var BASE_URL='<!--BASE_URL-->';var POLL_INTERVAL=<!--POLL_INTERVAL-->;</script>
<script src="sw-register.js"></script>
</head>
<body>
<div id="loginOverlay" class="overlay">
  <div class="login-box">
    <h2>ReadSync 登录</h2>
    <input type="text" id="loginUser" placeholder="用户名">
    <input type="password" id="loginPass" placeholder="密码">
    <label class="remember-label"><input type="checkbox" id="rememberMe"> 记住密码</label>
    <button id="loginBtn">登录</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>
<div class="container" id="mainApp" style="display:none">
  <h1><a href="index.html">ReadSync</a> <a href="courses.html" class="nav-link">课程</a> <a href="javascript:void(0)" class="nav-link" id="installScriptBtn">安装脚本</a></h1>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索标题或 URL...">
    <button id="deleteModeBtn" class="danger" onclick="deleteMode ? confirmDelete() : toggleDeleteMode()">删除</button>
  </div>
  <div id="entries" class="entries"></div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- 用户脚本安装弹窗 -->
<div id="scriptInstallOverlay" class="overlay" style="display:none">
  <div class="modal-box">
    <h2>安装 ReadSync 用户脚本</h2>
    <p class="modal-desc">用户脚本可以自动将浏览的页面同步到 ReadSync 服务器。请在浏览器中安装 <a href="https://www.tampermonkey.net/" target="_blank">Tampermonkey</a> 扩展后，点击下方按钮安装。</p>
    <div class="script-install-actions">
      <a id="directInstallLink" class="btn-primary" target="_blank" onclick="closeScriptInstall()">一键安装脚本</a>
      <button id="copyScriptLinkBtn" class="btn-secondary">复制脚本链接</button>
    </div>
    <div id="copySuccessMsg" class="copy-success" style="display:none">已复制到剪贴板</div>
    <div class="manual-install">
      <p class="manual-hint">提示：如果一键安装没有自动触发，请复制以下链接并在浏览器新标签页中打开：</p>
      <div class="script-url-display" id="scriptUrlDisplay"></div>
    </div>
    <button class="btn-close" onclick="closeScriptInstall()">关闭</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
