<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadSync</title>
<link rel="stylesheet" href="style.css">
<script>var BASE_URL='<!--BASE_URL-->';var POLL_INTERVAL=<!--POLL_INTERVAL-->;</script>
<script src="sw-register.js"></script>
</head>
<body>
<div id="loginOverlay" class="overlay">
  <div class="login-box">
    <h2>ReadSync 登录</h2>
    <input type="text" id="loginUser" placeholder="用户名">
    <input type="password" id="loginPass" placeholder="密码">
    <label class="remember-label"><input type="checkbox" id="rememberMe"> 记住密码</label>
    <button id="loginBtn">登录</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>
<div class="container" id="mainApp" style="display:none">
  <h1><a href="index.html">ReadSync</a> <a href="courses.html" class="nav-link">课程</a></h1>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索标题或 URL...">
    <button id="deleteModeBtn" class="danger" onclick="deleteMode ? confirmDelete() : toggleDeleteMode()">删除</button>
  </div>
  <div id="entries" class="entries"></div>
  <div class="pagination" id="pagination"></div>
</div>
<script src="script.js"></script>
</body>
</html>
