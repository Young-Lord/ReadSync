<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadSync 离线</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f5f5;
  color: #333;
}
.offline-panel {
  width: 100%;
  max-width: 420px;
  padding: 28px;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,0.14);
  text-align: center;
}
h1 {
  margin: 0 0 12px;
  color: #1a73e8;
  font-size: 22px;
}
p {
  margin: 0 0 18px;
  color: #666;
  line-height: 1.6;
}
button {
  padding: 9px 16px;
  border: 0;
  border-radius: 4px;
  background: #1a73e8;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
button:hover { background: #1557b0; }
@media (prefers-color-scheme: dark) {
  body { background: #1a1a2e; color: #e0e0e0; }
  .offline-panel { background: #16213e; }
  p { color: #aaa; }
}
</style>
</head>
<body>
<main class="offline-panel">
  <h1>网络连接不可用</h1>
  <p>网络恢复后会自动刷新。</p>
  <button id="retryBtn" type="button">立即重试</button>
</main>
<script>
(function () {
  const RETRY_MS = 20000;
  const CONNECTIVITY_CHECK_HEADER = 'X-ReadSync-Connectivity-Check';
  const retryBtn = document.getElementById('retryBtn');
  let retryTimer = null;
  let checking = false;

  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(checkConnection, RETRY_MS);
  }

  async function checkConnection() {
    if (checking) return;
    checking = true;
    clearTimeout(retryTimer);

    try {
      const response = await fetch(window.location.href, {
        cache: 'no-store',
        credentials: 'same-origin',
        redirect: 'manual',
        headers: { [CONNECTIVITY_CHECK_HEADER]: '1' },
      });

      if (response.status > 0 || response.type === 'opaqueredirect') {
        window.location.reload();
        return;
      }
    } catch (err) {
      // Still offline; wait for the next check.
    } finally {
      checking = false;
    }

    scheduleRetry();
  }

  retryBtn.addEventListener('click', checkConnection);
  window.addEventListener('online', checkConnection);
  checkConnection();
})();
</script>
</body>
</html>
