<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadSync - 课程</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="courses.css">
<script>var BASE_URL='<!--BASE_URL-->';var POLL_INTERVAL=0;</script>
</head>
<body>
<div id="loginOverlay" class="overlay">
  <div class="login-box">
    <h2>ReadSync 登录</h2>
    <input type="text" id="loginUser" placeholder="用户名">
    <input type="password" id="loginPass" placeholder="密码">
    <label class="remember-label"><input type="checkbox" id="rememberMe"> 记住密码</label>
    <button id="loginBtn">登录</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>
<div class="container" id="mainApp" style="display:none">
  <div class="page-header">
    <h1><a href="index.html" class="back-link">ReadSync</a> / 课程</h1>
  </div>
  <div class="toolbar">
    <button id="addCourseBtn" class="primary">+ 新增课程</button>
  </div>
  <div id="courseList" class="course-list"></div>
</div>

<div id="courseModal" class="overlay" style="display:none">
  <div class="modal-box">
    <h2 id="modalTitle">新增课程</h2>
    <input type="text" id="courseName" placeholder="课程名称">
    <input type="text" id="courseShortId" placeholder="short_id (用于 /course/jump/<short_id>)">
    <input type="text" id="courseTitlePattern" placeholder="标题正则匹配 (可选)">
    <input type="text" id="courseUrlPattern" placeholder="URL 正则匹配 (可选)">
    <div class="modal-actions">
      <button id="modalCancel" class="secondary">取消</button>
      <button id="modalSave" class="primary">保存</button>
    </div>
    <div id="modalError" class="login-error"></div>
  </div>
</div>

<script src="courses.js"></script>
</body>
</html>
